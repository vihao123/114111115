<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨年派對報名表單</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <img src="img/newyear.jpg" width="100%" height="250px">
    
    <div class="content">
        <h1>跨年派對報名_Template</h1>
        <div class="description indent">
            <strong>❗快來使用此範本，可以編輯這份範本的所有內容、圖片</strong><br>
            又是一年一度的跨年啦！實在是太久沒見了！<br>
            今年要到大雄家吃火鍋，麻煩大家填一下資料吧！<br>
            期待到時候和大家見面啊啊啊啊！
        </div>

        <form id="partyForm">
            <div class="question">
                <div class="question-title">
                    <span class="question-number">1</span> 你是誰
                </div>
                <input type="text" placeholder="請填入文字">
            </div>

            <div class="question">
                <div class="question-title">
                    <span class="question-number">2</span> 會來幾個人
                </div>
                <div class="options-grid">
                    <div class="option-item"><div class="radio-circle"></div> 一個人</div><br>
                    <div class="option-item"><div class="radio-circle"></div> 兩個人</div><br>
                    <div class="option-item"><div class="radio-circle"></div> 三個人</div><br>
                    <div class="option-item"><div class="radio-circle"></div> 三個人以上</div><br>
                </div>
            </div>

            <div class="question">
                <div class="question-title">
                    <span class="question-number">3</span> 此次最多可接受的預算（人）
                </div>
                <span class="sub-text">包含吃喝玩樂所有的花費</span>
                <div class="slider-container">
                    <div class="slider-header">
                        <span id="slider-value" style="color:#4a6991; font-weight:bold;">300</span>
                        <div class="currency-label">元</div>
                    </div>
                    <input type="range" id="budget-slider" min="300" max="2000" step="100" value="300">
                    <div class="slider-labels">
                        <span>300</span>
                        <span>2000</span>
                    </div>
                </div>
            </div>

            <div class="question">
                <div class="question-title">
                    <span class="question-number">4</span> 跨年當天希望有什麼活動
                </div>
                <span class="sub-text">例：桌遊、PS4、喝酒、閒聊</span>
                <textarea placeholder="請填入文字"></textarea>
            </div>

            <div class="question">
                <div class="question-title">
                    <span class="question-number">5</span> 你可以幫忙帶
                </div>
                <span class="sub-text">例：撲克牌、桌遊、酒類、食物</span>
                <textarea placeholder="請填入文字"></textarea>
            </div>

            <div class="submit-container">
                <button type="submit" class="btn-submit">送出</button>
            </div>
        </form>
    </div>
</div>

<script>
    const slider = document.getElementById("budget-slider");
    const output = document.getElementById("slider-value");

    slider.oninput = function() {
        output.innerHTML = this.value;
        const percent = (this.value - this.min) / (this.max - this.min) * 100;
        this.style.setProperty('--value', percent + '%');
    }
</script>

</body>
</html>
